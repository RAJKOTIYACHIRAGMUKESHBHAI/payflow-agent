# ==========================================
# PayFlow Agent - Main Application Settings
# ==========================================

spring.application.name=payflow-agent

# ==========================================
# Server
# ==========================================

server.port=8080

# ==========================================
# MySQL Database
# ==========================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/payflow?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=Rcm@2005
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ==========================================
# JPA / Hibernate
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# Flyway Database Migrations
# ==========================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# ==========================================
# Jackson / JSON
# Jackson 3 in Spring Boot 4 already uses
# ISO-8601 date/time strings by default.
# ==========================================

spring.jackson.time-zone=Asia/Kolkata

# ==========================================
# Actuator
# ==========================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ==========================================
# Logging
# ==========================================

logging.level.com.payflow=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ==========================================
# PayPal Sandbox
# ==========================================

paypal.base-url=https://api-m.sandbox.paypal.com
paypal.client-id=${PAYPAL_CLIENT_ID:BAAqmCJgt8bUrOgUbScwN1xsh-qhkayPyKlx8zgF7cczs2cXSjBCqcq0fZxurGqRJDntiAzx3HxHMUvQ3Q}
